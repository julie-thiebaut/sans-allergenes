<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Sans Allergènes</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License — https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrite, so a direct load/refresh of a deep
      // route (e.g. /restaurant/le-nom) 404s. This script re-encodes the path into a
      // query string and redirects to the app root, where the inline script in
      // index.html decodes it back into the real URL via history.replaceState.
      //
      // pathSegmentsToKeep = 1 because the site is currently reachable at the
      // /repo-name/ subpath (https://user.github.io/repo-name/) — the custom domain
      // (sans-allergenes.fr) isn't live yet (DNS not configured, see NOTES.md). Once the
      // custom domain is the primary way visitors reach the site, change this to 0 (must
      // match ci-deploy.yml's BASE_PATH, which needs the same change at the same time).
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
