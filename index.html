<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fallback metadata only: scripts/prerender.ts overwrites this managed search/social set per
      route. Kept in step with buildHomeMeta in src/seo/seoData.ts so the raw index never ships
      copy or share metadata the site has moved on from.
    -->
    <title data-seo-managed="true">Sans Allergènes · Trouvez où manger sans allergènes</title>
    <meta
      name="description"
      content="Consultez les 14 allergènes réglementaires déclarés pour chaque plat, et filtrez la carte selon les allergènes que vous évitez."
      data-seo-managed="true"
    />
    <link rel="canonical" href="https://sans-allergenes.fr/" data-seo-managed="true" />

    <meta
      property="og:title"
      content="Sans Allergènes · Trouvez où manger sans allergènes"
      data-seo-managed="true"
    />
    <meta
      property="og:description"
      content="Consultez les 14 allergènes réglementaires déclarés pour chaque plat, et filtrez la carte selon les allergènes que vous évitez."
      data-seo-managed="true"
    />
    <meta property="og:url" content="https://sans-allergenes.fr/" data-seo-managed="true" />
    <meta property="og:type" content="website" data-seo-managed="true" />
    <meta property="og:site_name" content="Sans Allergènes" data-seo-managed="true" />
    <meta property="og:locale" content="fr_FR" data-seo-managed="true" />
    <meta
      property="og:image"
      content="https://sans-allergenes.fr/og-image.png"
      data-seo-managed="true"
    />
    <meta
      property="og:image:secure_url"
      content="https://sans-allergenes.fr/og-image.png"
      data-seo-managed="true"
    />
    <meta property="og:image:type" content="image/png" data-seo-managed="true" />
    <meta property="og:image:width" content="1200" data-seo-managed="true" />
    <meta property="og:image:height" content="630" data-seo-managed="true" />
    <meta
      property="og:image:alt"
      content="Sans Allergènes : les allergènes déclarés par les restaurants, plat par plat."
      data-seo-managed="true"
    />

    <meta name="twitter:card" content="summary_large_image" data-seo-managed="true" />
    <meta
      name="twitter:image"
      content="https://sans-allergenes.fr/og-image.png"
      data-seo-managed="true"
    />
    <meta
      name="twitter:image:alt"
      content="Sans Allergènes : les allergènes déclarés par les restaurants, plat par plat."
      data-seo-managed="true"
    />
    <meta
      name="twitter:title"
      content="Sans Allergènes · Trouvez où manger sans allergènes"
      data-seo-managed="true"
    />
    <meta
      name="twitter:description"
      content="Consultez les 14 allergènes réglementaires déclarés pour chaque plat, et filtrez la carte selon les allergènes que vous évitez."
      data-seo-managed="true"
    />
    <!--
      favicon.svg is the source of truth; the other two are generated from it by
      `npm run favicons`. The .ico is listed first and the SVG second on purpose: browsers
      take the last format they understand, so modern ones get the scalable file while the
      rest fall back to the bitmap.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f1b104" />
    <!--
      GitHub Pages SPA redirect trick (rafgraph/spa-github-pages): when 404.html
      bounces a deep-link request back here as ?/path, restore the real URL via
      history.replaceState before the app boots, so React Router sees the right route.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!--
      No Google Maps script tag here on purpose: it is injected dynamically by
      src/maps/GoogleMapsAdapter.ts, only after config.json confirms googleMapsEnabled=true.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
